<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手记</title>
<meta name="description" content="写字的地方">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="./">手记</a></h1>
    <p>写字的地方</p>
  </header>

  <ul class="posts" id="list"><li class="empty">载入中…</li></ul>

  <footer class="site">© <span id="yr"></span> 手记</footer>
</div>

<script>
(function () {
  var list = document.getElementById('list');
  document.getElementById('yr').textContent = new Date().getFullYear();

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  fetch('posts/index.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      var posts = (d.posts || []).slice();
      if (!posts.length) { list.innerHTML = '<li class="empty">还没有文章</li>'; return; }
      list.innerHTML = posts.map(function (p) {
        return '<li><time>' + esc(p.date || '') + '</time>' +
               '<a href="post.html?p=' + encodeURIComponent(p.slug) + '">' + esc(p.title) + '</a></li>';
      }).join('');
    })
    .catch(function () {
      list.innerHTML = '<li class="empty">目录载入失败，刷新试试</li>';
    });
})();
</script>
</body>
</html>
