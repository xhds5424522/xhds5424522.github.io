<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手记</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 返回</a>
  <article id="art"><p class="empty">载入中…</p></article>
  <footer class="site"><a href="./">手记</a></footer>
</div>

<script src="assets/md.js"></script>
<script>
(function () {
  var art = document.getElementById('art');
  var p = new URLSearchParams(location.search).get('p');

  if (!p || !/^[A-Za-z0-9._-]+$/.test(p)) {
    art.innerHTML = '<p class="empty">没有这篇文章</p>';
    return;
  }

  fetch('posts/' + p + '.md', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (txt) {
      var out = md.parse(txt);
      document.title = out.title + ' · 手记';
      art.innerHTML = '<h1>' + md.esc(out.title) + '</h1>' + out.body;
      window.scrollTo(0, 0);
    })
    .catch(function () {
      art.innerHTML = '<p class="empty">没有这篇文章</p>';
    });
})();
</script>
</body>
</html>
